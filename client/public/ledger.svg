<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Cutroom</title>
  <desc id="description">Small splice mark: two white rounded bars with a vertical cut, right bar shifted down</desc>
  <defs>
    <linearGradient id="surface" x1="22" y1="14" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#378FE9"/>
      <stop offset="1" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="highlight" x1="64" y1="18" x2="64" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#surface)"/>
  <rect x="9" y="9" width="110" height="56" rx="27" fill="url(#highlight)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- Two bars, 6px gap, right bar +2px -->
  <rect x="28" y="48" width="29" height="32" rx="8" fill="#FFFFFF"/>
  <rect x="63" y="50" width="29" height="32" rx="8" fill="#FFFFFF"/>
</svg>
