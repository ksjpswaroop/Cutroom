<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cutroom</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f6f8;
      }
      .shell {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(55, 143, 233, 0.18), transparent 55%),
          linear-gradient(180deg, #f8fafc 0%, #eef3f7 100%);
      }
      .mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(145deg, #378FE9 0%, #0A66C2 100%);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 28px rgba(10, 102, 194, 0.28);
      }
      .mark svg { width: 56px; height: 56px; display: block; }
      .name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0a66c2;
      }
      .sub {
        font-size: 12px;
        color: #5b6b7c;
        text-align: center;
        max-width: 240px;
        line-height: 1.35;
      }
      .bar {
        width: 140px;
        height: 3px;
        border-radius: 999px;
        background: rgba(10, 102, 194, 0.12);
        overflow: hidden;
        margin-top: 2px;
      }
      .bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #0a66c2;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="mark" aria-hidden="true">
        <!-- Same splice glyph as the app icon (scaled into the blue shell) -->
        <svg viewBox="22 40 84 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ffffff" d="M30 40.5 H61 V87.75 H30 A8 8 0 0 1 22 79.75 V48.5 A8 8 0 0 1 30 40.5 Z"/>
          <path fill="#ffffff" d="M67 44.5 H98 A8 8 0 0 1 106 52.5 V79.75 A8 8 0 0 1 98 87.75 H67 V44.5 Z"/>
        </svg>
      </div>
      <div class="name">Cutroom</div>
      <div class="sub">Research through package in one room</div>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
  </body>
</html>
