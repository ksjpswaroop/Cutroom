name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Run TypeScript check
        run: npm run check

      - name: Build production bundle
        run: npm run build

  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri.conf.json bundles resources/app/**/*, which `npm run desktop:prepare`
      # generates and .gitignore excludes. On a clean checkout that directory does
      # not exist, and tauri-build aborts the build script before any Rust is
      # compiled (exit 101, "glob pattern ... didn't match any files").
      # cargo check only needs the glob to match, not the real sidecar payload —
      # a placeholder keeps the strict glob intact for genuine bundle builds.
      - name: Create sidecar resource placeholder
        run: |
          mkdir -p src-tauri/resources/app
          printf 'Placeholder so the tauri.conf.json resource glob matches during cargo check.\nThe real sidecar payload is generated by: npm run desktop:prepare\n' \
            > src-tauri/resources/app/PLACEHOLDER.txt

      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check
